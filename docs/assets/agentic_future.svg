<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
.flow{stroke-dasharray:6 7;animation:d 1.4s linear infinite} @keyframes d{to{stroke-dashoffset:-26}}
.pulse{transform-box:fill-box;transform-origin:center;animation:p 2.4s ease-in-out infinite} @keyframes p{0%,100%{opacity:.95}50%{opacity:.35}}
.orb{transform-box:fill-box;transform-origin:center;animation:sp 18s linear infinite}@keyframes sp{to{transform:rotate(360deg)}} .ring{transform-box:fill-box;transform-origin:center;animation:pr 3s ease-out infinite}@keyframes pr{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.5);opacity:0}}
</style>
