<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B16"/>
      <stop offset="0.55" stop-color="#0A1830"/>
      <stop offset="1" stop-color="#071224"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#7FE7FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3B5C" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF3B5C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#18304F" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .flow { stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
      .flow.slow { animation-duration: 2.6s; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.6); opacity: .25 } }
      .blink { animation: blink 1.4s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0.25 } }
      .scan { animation: scan 5s linear infinite; }
      @keyframes scan { from { transform: translateX(-260px) } to { transform: translateX(1200px) } }
    </style>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="160" height="380" fill="#00D4FF" opacity="0.035"/>

  <!-- ===== laundering ring network (right) ===== -->
  <g transform="translate(790,190)">
    <circle r="150" fill="url(#glow)"/>
    <!-- edges -->
    <g fill="none" stroke-width="2">
      <path class="flow" d="M0 0 L-118 -78" stroke="#2D5B8A"/>
      <path class="flow" d="M0 0 L-128 52" stroke="#2D5B8A"/>
      <path class="flow" d="M0 0 L-40 128" stroke="#2D5B8A"/>
      <path class="flow" d="M0 0 L110 -92" stroke="#FF3B5C" stroke-width="3"/>
      <path class="flow" d="M0 0 L148 18" stroke="#FF3B5C" stroke-width="3"/>
      <path class="flow" d="M0 0 L82 112" stroke="#FAB219" stroke-width="2.5"/>
      <path class="flow" d="M0 0 L-26 -134" stroke="#2D5B8A"/>
      <path class="flow slow" d="M110 -92 L205 -120" stroke="#FF3B5C" stroke-width="2.4"/>
      <path class="flow slow" d="M110 -92 L232 -48" stroke="#FF3B5C" stroke-width="2.4"/>
      <path class="flow slow" d="M148 18 L232 -48" stroke="#FF3B5C" stroke-width="2.4"/>
      <path class="flow slow" d="M148 18 L250 64" stroke="#FAB219"/>
      <path class="flow slow" d="M82 112 L170 150" stroke="#FAB219"/>
      <path class="flow slow" d="M-118 -78 L-210 -40" stroke="#22314A"/>
      <path class="flow slow" d="M-128 52 L-220 90" stroke="#22314A"/>
    </g>
    <!-- nodes -->
    <circle class="pulse" r="22" fill="#00D4FF" opacity="0.5"/>
    <circle r="17" fill="#00D4FF" stroke="#fff" stroke-width="3"/>
    <text class="m" y="42" text-anchor="middle" font-size="11" fill="#E9F1FA" font-weight="700">ACC-743</text>

    <circle cx="-118" cy="-78" r="9" fill="#2ECC71"/>
    <circle cx="-128" cy="52" r="9" fill="#2ECC71"/>
    <circle cx="-40" cy="128" r="9" fill="#FAB219"/>
    <circle cx="-26" cy="-134" r="9" fill="#2ECC71"/>
    <circle cx="-210" cy="-40" r="6" fill="#2ECC71" opacity="0.7"/>
    <circle cx="-220" cy="90" r="6" fill="#2ECC71" opacity="0.7"/>

    <circle cx="110" cy="-92" r="22" fill="url(#redglow)"/>
    <circle cx="110" cy="-92" r="11" fill="#FF3B5C"/>
    <circle cx="148" cy="18" r="22" fill="url(#redglow)"/>
    <circle cx="148" cy="18" r="11" fill="#FF3B5C"/>
    <circle cx="82" cy="112" r="10" fill="#FF8A3D"/>
    <circle cx="232" cy="-48" r="14" fill="#FF3B5C" stroke="#FFD0D8" stroke-width="2"/>
    <circle class="pulse" cx="232" cy="-48" r="14" fill="#FF3B5C" opacity="0.4"/>
    <circle cx="205" cy="-120" r="7" fill="#FF3B5C"/>
    <circle cx="250" cy="64" r="7" fill="#FAB219"/>
    <circle cx="170" cy="150" r="7" fill="#FAB219"/>

    <g class="t" font-size="11">
      <rect x="252" y="-60" rx="9" width="132" height="22" fill="#2A0C16" stroke="#FF3B5C" stroke-width="1"/>
      <text x="318" y="-45" text-anchor="middle" fill="#FF9AAD" class="blink">⚠ suspicious hub</text>
      <rect x="190" y="96" rx="9" width="118" height="22" fill="#2A1A06" stroke="#FAB219" stroke-width="1"/>
      <text x="249" y="111" text-anchor="middle" fill="#FFD27A">mule chain</text>
    </g>
  </g>

  <!-- ===== Title block (left) ===== -->
  <g class="t">
    <g transform="translate(64,92)">
      <path d="M22 0 L44 8 V26 C44 40 34 50 22 56 C10 50 0 40 0 26 V8 Z" fill="none" stroke="#00D4FF" stroke-width="3"/>
      <path d="M12 28 L20 36 L33 20" fill="none" stroke="#00D4FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="124" y="136" font-size="58" font-weight="800" fill="url(#title)" letter-spacing="-1">FinShield AI</text>
    <text x="66" y="186" font-size="22" font-weight="600" fill="#CFE3F7">Anti-Money-Laundering Intelligence Platform</text>
    <text x="66" y="222" font-size="16" fill="#8FA9C6">Click one flagged transaction → see the whole laundering ring.</text>
    <text x="66" y="246" font-size="16" fill="#8FA9C6">Linked accounts · mule chains · suspicious hubs · explained by SHAP.</text>

    <g transform="translate(66,280)" font-size="13" font-weight="600">
      <rect width="148" height="34" rx="17" fill="#0E2A44" stroke="#00D4FF" stroke-opacity="0.6"/>
      <text x="74" y="22" text-anchor="middle" fill="#9BE9FF">5.08M transactions</text>
      <rect x="160" width="138" height="34" rx="17" fill="#0E2A44" stroke="#00D4FF" stroke-opacity="0.6"/>
      <text x="229" y="22" text-anchor="middle" fill="#9BE9FF">AUC-ROC 0.973</text>
      <rect x="310" width="170" height="34" rx="17" fill="#2A0C16" stroke="#FF3B5C" stroke-opacity="0.7"/>
      <text x="395" y="22" text-anchor="middle" fill="#FF9AAD">9 ML + DL models</text>
    </g>
  </g>
</svg>
