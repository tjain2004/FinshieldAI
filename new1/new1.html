<!--
  FinShield AI — new1.html
  Two marked sections, spliced into the page by new1.py:
    NEW1:STYLE  -> before </head>
    NEW1:SHELL  -> end of <body>, followed by <script src="/new1.js">
  new1.js moves the SHELL pieces into place and switches the page into the
  new layout by adding class "fs1" to <body>. Remove that class (or run
  dashboard/new.py) and the original layout is back, untouched.
-->

<!-- NEW1:STYLE -->
<style>
/* ================================================================
   new1 design tokens (extend the dashboard's own :root tokens)
   ================================================================ */
:root{
  --fs1-grad: linear-gradient(135deg,#00E5FF 0%,#3B82F6 55%,#8B5CF6 100%);
  --fs1-grad-soft: linear-gradient(135deg,#00E5FF22,#8B5CF622);
  --fs1-glass: rgba(6,13,26,.78);
  --fs1-line: rgba(80,130,200,.18);
  --fs1-violet:#8B5CF6;
  --fs1-ease: cubic-bezier(.2,.8,.2,1);
}

/* ── shell ─────────────────────────────────────────────── */
body.fs1 .sidebar,
body.fs1 .topbar{display:none !important}
body.fs1 #app{display:block;position:relative}
body.fs1 .main{height:100vh;position:relative;isolation:isolate}

/* animated aurora behind everything */
body.fs1 .main::before{
  content:"";position:absolute;inset:-20%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(40% 35% at 15% 0%, #00b4ff14, transparent 70%),
    radial-gradient(35% 30% at 85% 5%, #8b5cf618, transparent 70%),
    radial-gradient(45% 40% at 60% 100%, #0ea5e90f, transparent 70%);
  animation:fs1-aurora 22s ease-in-out infinite alternate;
}
@keyframes fs1-aurora{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(-3%,2%,0) scale(1.06)}
  100%{transform:translate3d(3%,-2%,0) scale(1.02)}
}
body.fs1 .content{padding:22px 32px 70px;scroll-behavior:smooth}
body.fs1 .content > .page{max-width:1440px;margin:0 auto}

/* ── header ────────────────────────────────────────────── */
#fs1-head{
  position:relative;z-index:30;flex-shrink:0;height:66px;
  display:flex;align-items:center;gap:22px;padding:0 24px;
  background:var(--fs1-glass);backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--fs1-line);
}
#fs1-head::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,#00E5FF66 20%,#8B5CF666 80%,transparent);
}
.fs1-brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0;cursor:pointer;user-select:none}
.fs1-logo{width:38px;height:38px;filter:drop-shadow(0 0 10px #00b4ff40);transition:transform .5s var(--fs1-ease)}
.fs1-brand:hover .fs1-logo{transform:rotate(-8deg) scale(1.07)}
.fs1-word{display:flex;flex-direction:column;line-height:1}
.fs1-name{font-size:18px;font-weight:800;letter-spacing:-.4px;color:#fff}
.fs1-name b{background:var(--fs1-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-left:3px}
.fs1-tag{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin-top:5px;font-weight:600}

/* main tabs */
#fs1-tabs{
  position:relative;display:flex;align-items:center;gap:2px;padding:4px;
  background:#0a162bcc;border:1px solid var(--fs1-line);border-radius:14px;
  margin:0 auto;overflow-x:auto;scrollbar-width:none;max-width:100%;
}
#fs1-tabs::-webkit-scrollbar{display:none}
.fs1-ind{
  position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:10px;z-index:0;
  background:linear-gradient(135deg,#00E5FF26,#8B5CF62e);
  border:1px solid #38bdf866;box-shadow:0 0 18px #00b4ff26, inset 0 0 12px #00e5ff14;
  transition:left .38s var(--fs1-ease),width .38s var(--fs1-ease);
}
.fs1-tab{
  position:relative;z-index:1;display:flex;align-items:center;gap:8px;white-space:nowrap;
  padding:9px 16px;border-radius:10px;border:0;background:none;cursor:pointer;
  color:var(--text2);font:600 13px var(--sans);transition:color .2s;
}
.fs1-tab svg{width:17px;height:17px;flex-shrink:0;opacity:.8;transition:transform .3s var(--fs1-ease),opacity .2s}
.fs1-tab:hover{color:#fff}
.fs1-tab:hover svg{transform:translateY(-1px) scale(1.08);opacity:1}
.fs1-tab.on{color:#fff}
.fs1-tab.on svg{opacity:1;color:#00E5FF}
.fs1-tab .fs1-key{font:600 9px var(--mono);color:var(--text3);border:1px solid var(--border2);border-radius:4px;padding:1px 4px;margin-left:2px}
.fs1-badge{font:700 9.5px var(--mono);padding:2px 7px;border-radius:20px;background:#e3555526;color:#ff8a8a;border:1px solid #e3555555}
.fs1-pulse{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 #22c55e88;animation:fs1-pulse 1.8s infinite}
@keyframes fs1-pulse{70%{box-shadow:0 0 0 7px #22c55e00}100%{box-shadow:0 0 0 0 #22c55e00}}

/* right controls */
.fs1-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.fs1-search{
  display:flex;align-items:center;gap:10px;height:36px;padding:0 10px 0 12px;min-width:220px;
  background:#0a162b;border:1px solid var(--border2);border-radius:10px;cursor:pointer;
  color:var(--text3);font:500 12px var(--sans);transition:border-color .2s,box-shadow .2s;
}
.fs1-search:hover{border-color:#38bdf899;box-shadow:0 0 0 3px #00b4ff14;color:var(--text2)}
.fs1-search svg{width:15px;height:15px}
.fs1-search span{flex:1;text-align:left}
.fs1-kbd{font:600 10px var(--mono);color:var(--text2);border:1px solid var(--border2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--bg2)}
body.fs1 #fs1-head .chip{font-size:10.5px;padding:5px 11px}

/* scroll progress */
#fs1-progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--fs1-grad);z-index:2;transition:width .08s linear;box-shadow:0 0 8px #00e5ff99}

/* ── notebook sub-tabs (pipeline stepper) ──────────────── */
.fs1-sub-wrap{position:sticky;top:-22px;z-index:20;max-width:1440px;margin:-22px auto 20px;padding:14px 0 12px;
  background:rgba(5,11,22,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 14px 18px -12px rgba(5,11,22,.95)}
.fs1-sub-wrap::before{content:"";position:absolute;top:0;bottom:0;left:-32px;right:-32px;z-index:-1;background:inherit}
.fs1-sub-wrap[hidden]{display:none}
.fs1-sub-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px}
.fs1-sub-title{font:700 10px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--text3)}
.fs1-sub-title b{color:#7dd3fc}
.fs1-sub-nav{display:flex;gap:6px}
.fs1-arrow{width:30px;height:28px;border-radius:8px;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;display:grid;place-items:center;transition:all .2s}
.fs1-arrow:hover:not(:disabled){border-color:#38bdf8;color:#fff;transform:translateY(-1px)}
.fs1-arrow:disabled{opacity:.35;cursor:default}
.fs1-arrow svg{width:14px;height:14px}

#fs1-sub{position:relative;display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin;scroll-behavior:smooth}
#fs1-sub::-webkit-scrollbar{height:4px}#fs1-sub::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.fs1-step{
  position:relative;flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:9px;
  padding:8px 13px 8px 8px;border-radius:12px;cursor:pointer;
  background:var(--bg2);border:1px solid var(--border);color:var(--text2);
  font:600 12px var(--sans);white-space:nowrap;
  transition:transform .25s var(--fs1-ease),border-color .2s,background .2s,color .2s,box-shadow .25s;
}
.fs1-step:hover{transform:translateY(-2px);border-color:#38bdf866;color:#fff}
.fs1-step .n{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
  font:700 10.5px var(--mono);color:var(--text2);background:var(--bg4);border:1px solid var(--border2);
  transition:all .25s;
}
.fs1-step.done .n{color:#7dd3fc;border-color:#38bdf855;background:#0c2a44}
.fs1-step.on{background:linear-gradient(135deg,#0d2a4a,#1a1a46);border-color:#38bdf8aa;color:#fff;box-shadow:0 6px 20px -8px #00b4ff66}
.fs1-step.on .n{background:var(--fs1-grad);color:#04101f;border-color:transparent;box-shadow:0 0 12px #00e5ff66}
.fs1-step + .fs1-step::before{
  content:"";position:absolute;left:-9px;top:50%;width:8px;height:2px;background:var(--border2);
}
.fs1-step.done + .fs1-step::before,.fs1-step.done + .fs1-step.on::before{background:#38bdf8}
.fs1-bar{height:3px;border-radius:3px;background:var(--bg4);overflow:hidden;margin-top:4px}
.fs1-bar i{display:block;height:100%;width:0;background:var(--fs1-grad);transition:width .45s var(--fs1-ease)}

/* ── page polish ───────────────────────────────────────── */
body.fs1 .page.active{animation:fs1-in .42s var(--fs1-ease)}
@keyframes fs1-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body.fs1 .page-head .h1{background:linear-gradient(90deg,#fff 30%,#a5d8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
body.fs1 .card{border-color:#1d3253;transition:border-color .25s,box-shadow .25s;background:linear-gradient(180deg,#0b1d38,#0a1830)}
body.fs1 .card:hover{border-color:#2b4a78;box-shadow:0 10px 30px -18px #00b4ff55}
body.fs1 .stat-card{transition:transform .25s var(--fs1-ease),box-shadow .25s,border-color .25s}
body.fs1 .stat-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -16px #00b4ff66;border-color:#38bdf866}
body.fs1 .pipe-step{transition:transform .2s var(--fs1-ease),border-color .2s,background .2s}
body.fs1 .pipe-step:hover{transform:translateY(-2px);background:#0f2a4a}
body.fs1 .btn{transition:transform .15s,box-shadow .2s,filter .2s}
body.fs1 .btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px -6px #00d4ff88;filter:brightness(1.08)}
body.fs1 .stat-val.fs1-counting{color:#bdf4ff}

/* prev / next pager at the bottom of notebook pages */
.fs1-pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:28px 0 8px}
.fs1-pg{
  display:flex;flex-direction:column;gap:4px;padding:14px 18px;border-radius:12px;cursor:pointer;
  background:var(--bg2);border:1px solid var(--border);text-align:left;color:var(--text);
  font:600 14px var(--sans);transition:all .25s var(--fs1-ease);
}
.fs1-pg small{font:600 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
.fs1-pg.next{text-align:right}
.fs1-pg:hover{border-color:#38bdf899;transform:translateY(-2px);box-shadow:0 10px 24px -14px #00b4ff88}
.fs1-pg[hidden]{visibility:hidden;display:flex}

/* ── command palette ───────────────────────────────────── */
#fs1-pal{position:fixed;inset:0;z-index:100;display:grid;place-items:start center;padding-top:12vh;
  background:#02060dcc;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#fs1-pal[hidden]{display:none}
.fs1-pal-box{width:min(640px,92vw);border-radius:16px;overflow:hidden;
  background:#0a1730;border:1px solid #2a4670;box-shadow:0 30px 80px -20px #000, 0 0 0 1px #00e5ff14, 0 0 50px -10px #00b4ff44;
  animation:fs1-pop .22s var(--fs1-ease)}
@keyframes fs1-pop{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.fs1-pal-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.fs1-pal-in svg{width:18px;height:18px;color:#7dd3fc;flex-shrink:0}
.fs1-pal-in input{flex:1;background:none;border:0;outline:0;color:#fff;font:500 16px var(--sans)}
.fs1-pal-in input::placeholder{color:var(--text3)}
#fs1-pal-list{max-height:52vh;overflow-y:auto;padding:8px}
.fs1-pal-sec{font:700 9.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--text3);padding:10px 10px 6px}
.fs1-pal-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--text2);font:500 13.5px var(--sans)}
.fs1-pal-item .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
  background:var(--bg4);border:1px solid var(--border2);font:700 10px var(--mono);color:#7dd3fc}
.fs1-pal-item .ic svg{width:15px;height:15px}
.fs1-pal-item .tx{flex:1;min-width:0}
.fs1-pal-item .tx b{display:block;color:var(--text);font-weight:600}
.fs1-pal-item .tx span{font-size:11.5px;color:var(--text3)}
.fs1-pal-item .go{font:600 10px var(--mono);color:var(--text3);opacity:0}
.fs1-pal-item.sel{background:linear-gradient(90deg,#00e5ff1a,#8b5cf614);color:#fff}
.fs1-pal-item.sel .ic{background:var(--fs1-grad);color:#04101f;border-color:transparent}
.fs1-pal-item.sel .go{opacity:1}
.fs1-pal-foot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--border);font:500 11px var(--sans);color:var(--text3)}
.fs1-pal-empty{padding:26px;text-align:center;color:var(--text3);font-size:13px}

/* toast */
#fs1-toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;z-index:90;pointer-events:none;
  padding:10px 16px;border-radius:12px;background:#0b1d38;border:1px solid #2b4a78;color:var(--text);font:500 12.5px var(--sans);
  box-shadow:0 14px 40px -12px #000;transition:all .35s var(--fs1-ease)}
#fs1-toast.show{opacity:1;transform:translate(-50%,0)}
#fs1-toast .fs1-kbd{margin:0 2px}

/* ── responsive ───────────────────────────────────────── */
@media (max-width:1280px){.fs1-tab .fs1-key{display:none}.fs1-search{min-width:0}.fs1-search span{display:none}}
@media (max-width:1100px){.fs1-tag{display:none}.fs1-tab{padding:9px 12px}body.fs1 #fs1-head .chip:not(.live){display:none}}
@media (max-width:900px){
  #fs1-head{height:auto;flex-wrap:wrap;padding:10px 14px;gap:10px}
  #fs1-tabs{order:3;width:100%;margin:0}
  .fs1-tab span.lbl{font-size:12px}
  body.fs1 .main{height:100vh}
  body.fs1 .content{padding:18px 16px 60px}
}
@media (prefers-reduced-motion:reduce){
  body.fs1 .main::before,body.fs1 .page.active,.fs1-pulse{animation:none}
  .fs1-ind,.fs1-step,.fs1-pg{transition:none}
}
</style>
<!-- /NEW1:STYLE -->
